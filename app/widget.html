<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="css/style.css"> 
    <script src="js/index.js"></script>
    <script>
      $(function() {
        $("#allComponents tbody").sortable({
          helper: function(e, tr) {
            var $originals = tr.children();
            var $helper = tr.clone();
            $helper.children().each(function(index) {
              $(this).width($originals.eq(index).width());
            });
            $helper.css({
              "border": "3px solid #f55142",
              "box-shadow": "0 8px 20px rgba(0, 0, 0, 0.4)",
              "background": "#f9fff9",
              "border-radius": "10px"
            });
            return $helper;
          },
          cursor: "move",
        }).disableSelection();
      });
    </script>
  </head>
  <body>
    <input type="hidden" id="deal-name">
    <table id="allComponents">
      <thead>
        <tr>
          <th>Component Name</th>
          <th>Product</th>
          <th>Specifications</th>
          <th>Quantity</th>
          <th>Bidders</th>
          <th>Attachments</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
    <div id="loadingSection">
      <div class="loader-container">
      <div class="spinner"></div>
      <p>Loading Components...</p>
  </div>
    </div>
    <div class="btn-div">
      <button  class="add-row-btn" onclick="appendComponentRow('allComponents')">Add Row</button>
      <button class="save-btn" onclick="saveComponentForm(event)">Save</button>
    </div>
  </body>
</html>
